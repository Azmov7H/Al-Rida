<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" fill="none">
  <!-- Al-Reda device mark: stylized double-swing door with handle + security stripe -->

  <!-- Door frame -->
  <path d="M36,36H164L164,164H36Z" fill="none" stroke="#0F3B73" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Hinge dots -->
  <circle cx="76" cy="164" r="3" fill="#E2E8F0"/>
  <circle cx="124" cy="164" r="3" fill="#E2E8F0"/>

  <!-- Door leaf: glass top panel -->
  <rect x="68" y="40" width="60" height="28" rx="2" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="2"/>
  <!-- Handle ring -->
  <circle cx="100" cy="54" r="8" fill="none" stroke="#FFFFFF" stroke-width="3"/>
  <!-- Door leaf: wood body -->
  <rect x="64" y="66" width="72" height="94" rx="4" fill="#0F3B73" stroke="#0F3B73" stroke-width="3"/>
  <!-- Security stripe -->
  <rect x="64" y="72" width="6" height="72" rx="1" fill="#F58220"/>
  <!-- Small door number (wordmark hint, digit only for icon mark) -->
  <text x="100" y="110" text-anchor="middle" font-family="Cairo, Arial, sans-serif" font-size="9" font-weight="bold" fill="#FFFFFF">2</text>
</svg>
